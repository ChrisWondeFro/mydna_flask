[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mydna"
version = "1.0.0"
description = "Look up your DNA variants in a local copy of ClinVar, privately."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["genomics", "clinvar", "dna", "bioinformatics", "privacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "flask>=3.0,<4.0",
  "sqlalchemy>=2.0.30,<3.0",
  "pandas>=2.2,<3.0",
  "matplotlib>=3.8,<4.0",
  "reportlab>=4.1,<5.0",
  "requests>=2.32.2,<3.0",
  "python-dotenv>=1.0,<2.0",
  "waitress>=3.0,<4.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4.0"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
mydna = "mydna.cli:main"

[project.urls]
Homepage = "https://github.com/christian/mydna"
Issues = "https://github.com/christian/mydna/issues"

[tool.setuptools.packages.find]
include = ["mydna*"]

[tool.setuptools.package-data]
mydna = ["templates/*.html", "templates/partials/*", "static/css/*", "static/js/*", "static/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:mydna.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
