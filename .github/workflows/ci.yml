name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite builds its index from a small committed fixture, so it needs
      # no network access and never touches real genetic data.
      - name: Test
        run: pytest --cov=mydna --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mydna:ci .

      - name: Confirm the image runs as a non-root user
        run: |
          user=$(docker run --rm mydna:ci id -un)
          test "$user" = "mydna" || { echo "Image runs as $user"; exit 1; }

      - name: Confirm the CLI is wired up
        run: docker run --rm mydna:ci mydna --version
